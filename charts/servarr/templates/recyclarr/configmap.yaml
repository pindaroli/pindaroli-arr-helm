{{- if .Values.recyclarr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-recyclarr-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  recyclarr.yaml: |
    # Recyclarr configuration — auto-generated by Helm chart
    # Managed by: pindaroli-arr-helm ({{ .Chart.Version }})
    {{- if .Values.recyclarr.radarr.enabled }}
    radarr:
      radarr-instance:
        base_url: {{ .Values.recyclarr.radarr.url }}
        api_key: !env_var RADARR_API_KEY
        include:
          - template: radarr-quality-definition-movie
          - template: radarr-custom-formats-movie
    {{- end }}

    {{- if .Values.recyclarr.sonarr.enabled }}
    sonarr:
      sonarr-instance:
        base_url: {{ .Values.recyclarr.sonarr.url }}
        api_key: !env_var SONARR_API_KEY
        include:
          - template: sonarr-quality-definition-series
          - template: sonarr-v4-custom-formats-web-dl
    {{- end }}
{{- end }}
