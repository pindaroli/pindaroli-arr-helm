{{- if .Values.recyclarr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-recyclarr-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  recyclarr.yaml: |
    # Recyclarr configuration — auto-generated by Helm chart
    # Managed by: pindaroli-arr-helm ({{ .Chart.Version }})
    # DO NOT EDIT MANUALLY — changes will be overwritten on next helm upgrade
    {{- if .Values.recyclarr.radarr.enabled }}

    radarr:
      - name: Radarr
        base_url: {{ .Values.recyclarr.radarr.url }}
        api_key: !env_var RADARR_API_KEY

        custom_formats:
          - names:
              # --- Anti-Spam / Fake Torrents ---
              - "Bad Groups"
              - "Uploader"
              - "Fake"
              - "Honeypot"
              - "Unwanted"
            quality_profiles:
              - name: Any
                score: -10000

          - names:
              # --- Quality Boosters ---
              - "Repack/Proper"
              - "Scene"
            quality_profiles:
              - name: Any
                score: 100

        quality_definition:
          type: movie
    {{- end }}
    {{- if .Values.recyclarr.sonarr.enabled }}

    sonarr:
      - name: Sonarr
        base_url: {{ .Values.recyclarr.sonarr.url }}
        api_key: !env_var SONARR_API_KEY

        custom_formats:
          - names:
              - "Bad Groups"
              - "Fake"
              - "Honeypot"
              - "Unwanted"
            quality_profiles:
              - name: Any
                score: -10000

        quality_definition:
          type: series
    {{- end }}
{{- end }}
