{{- if .Values.recyclarr.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-recyclarr-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  recyclarr.yaml: |
    # Recyclarr configuration — auto-generated by Helm chart
    # Managed by: pindaroli-arr-helm ({{ .Chart.Version }})
    {{- if .Values.recyclarr.radarr.enabled }}
    radarr:
      radarr-instance:
        base_url: {{ .Values.recyclarr.radarr.url }}
        api_key: !env_var RADARR_API_KEY
        {{- if .Values.recyclarr.radarr.quality_definition }}
        quality_definition:
          {{- toYaml .Values.recyclarr.radarr.quality_definition | nindent 10 }}
        {{- end }}
        {{- if .Values.recyclarr.radarr.quality_profiles }}
        quality_profiles:
          {{- toYaml .Values.recyclarr.radarr.quality_profiles | nindent 10 }}
        {{- end }}
        {{- if .Values.recyclarr.radarr.include }}
        include:
          {{- range .Values.recyclarr.radarr.include }}
          - template: {{ . }}
          {{- end }}
        {{- end }}
    {{- end }}

    {{- if .Values.recyclarr.sonarr.enabled }}
    sonarr:
      sonarr-instance:
        base_url: {{ .Values.recyclarr.sonarr.url }}
        api_key: !env_var SONARR_API_KEY
        {{- if .Values.recyclarr.sonarr.quality_definition }}
        quality_definition:
          {{- toYaml .Values.recyclarr.sonarr.quality_definition | nindent 10 }}
        {{- end }}
        {{- if .Values.recyclarr.sonarr.quality_profiles }}
        quality_profiles:
          {{- toYaml .Values.recyclarr.sonarr.quality_profiles | nindent 10 }}
        {{- end }}
        {{- if .Values.recyclarr.sonarr.include }}
        include:
          {{- range .Values.recyclarr.sonarr.include }}
          - template: {{ . }}
          {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
