{{- if and (index .Values "jellyfin-classic").enabled (index .Values "jellyfin-classic").ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-jellyfin-classic
  labels:
    app.kubernetes.io/name: jellyfin-classic
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    {{- with (index .Values "jellyfin-classic").ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (index .Values "jellyfin-classic").ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if or (.Capabilities.APIVersions.Has "networking.k8s.io/v1/IngressClass") (.Capabilities.APIVersions.Has "networking.k8s.io/v1beta1/IngressClass") }}
  {{- if (index .Values "jellyfin-classic").ingress.ingressClassName }}
  ingressClassName: {{ (index .Values "jellyfin-classic").ingress.ingressClassName }}
  {{- end }}
  {{- end }}
  {{- if (index .Values "jellyfin-classic").ingress.tls }}
  tls:
  {{- range (index .Values "jellyfin-classic").ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  rules:
  {{- range (index .Values "jellyfin-classic").ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - pathType: Prefix
            path: {{ (index $.Values "jellyfin-classic").ingress.path }}
            backend:
              service:
                name: {{ $.Release.Name }}-jellyfin-classic
                port:
                  name: http
  {{- end }}
{{- end }}

---
{{ if and (index .Values "jellyfin-classic").tailscale.enabled (index .Values "jellyfin-classic").tailscale.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-jellyfin-classic
  labels:
    app.kubernetes.io/name: jellyfin-classic
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  defaultBackend:
    service:
      name: {{ .Release.Name }}-jellyfin-classic
      port:
        number: {{ (index .Values "jellyfin-classic").service.port }}
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ (index .Values "jellyfin-classic").tailscale.ingress.host }}
{{ end }}
