{{- if and .Values.autobrr.enabled .Values.autobrr.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-autobrr-provisioning
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: autobrr
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provisioner
        image: {{ .Values.autobrr.image.repository }}:{{ .Values.autobrr.image.tag }}
        env:
        {{- range $key, $value := .Values.autobrr.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if .Values.autobrr.provisioning.secrets.prowlarr }}
        - name: PROWLARR_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.autobrr.provisioning.secrets.prowlarr }}
              key: prowlarr-api-key
        {{- end }}
        volumeMounts:
        - name: autobrr-config
          mountPath: /config
        - name: admin-secrets-volume
          mountPath: /var/run/secrets/autobrr-admin
          readOnly: true
        - name: qbit-secrets-volume
          mountPath: /var/run/secrets/qbittorrent-creds
          readOnly: true
        - name: telegram-secrets-volume
          mountPath: /var/run/secrets/telegram-creds
          readOnly: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          API_URL="http://{{ .Release.Name }}-autobrr:{{ .Values.autobrr.service.port }}/api"

          # 1. ESTREZIONE CREDENZIALI
          ADMIN_USER=$(cat /var/run/secrets/autobrr-admin/username)
          ADMIN_PASS=$(cat /var/run/secrets/autobrr-admin/password)

          # 2. CREAZIONE UTENTE (Database Layer via CLI)
          echo "Inizializzazione utente amministratore nel database..."
          echo "$ADMIN_PASS" | autobrrctl --config /config create-user "$ADMIN_USER" || echo "Utente già esistente."

          # 3. ATTESA LIVENESS
          until curl -s -f "${API_URL}/healthz/readiness" > /dev/null; do
            echo "In attesa che il server web di Autobrr sia Ready..."
            sleep 3
          done

          # 4. LOGIN APPLICATIVO
          echo "Esecuzione login per recuperare il cookie di sessione..."
          curl -s -f -c /tmp/cookies.txt \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" \
            "${API_URL}/auth/login" > /dev/null

          # 5. CONFIGURAZIONE QBITTORRENT (Clients)
          Q_USER=$(cat /var/run/secrets/qbittorrent-creds/qbittorrent-user)
          Q_PASS=$(cat /var/run/secrets/qbittorrent-creds/qbittorrent-pass)
          
          {{- range .Values.autobrr.provisioning.clients }}
          CLIENT_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          CLIENT_PAYLOAD=$(echo "$CLIENT_PAYLOAD" | sed "s/SECRET_QBITTORRENT_USERNAME/$Q_USER/g" | sed "s/SECRET_QBITTORRENT_PASSWORD/$Q_PASS/g")
          
          EXISTING_CLIENTS=$(curl -s -b /tmp/cookies.txt "${API_URL}/download_clients")
          if echo "$EXISTING_CLIENTS" | jq -e ".[]? | select(.name == \"{{ .name }}\")" > /dev/null; then
            echo "Download client '{{ .name }}' già esistente. Salto."
          else
            echo "Creazione download client '{{ .name }}'..."
            curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${CLIENT_PAYLOAD}" "${API_URL}/download_clients"
          fi
          {{- end }}

          # 6. CONFIGURAZIONE TELEGRAM (Notifications)
          TG_TOKEN=$(cat /var/run/secrets/telegram-creds/token)
          TG_CHAT="{{ .Values.autobrr.provisioning.telegram.chatId }}"
          
          {{- range .Values.autobrr.provisioning.notifications }}
          NOTIF_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          NOTIF_PAYLOAD=$(echo "$NOTIF_PAYLOAD" | sed "s/SECRET_TELEGRAM_TOKEN/$TG_TOKEN/g" | sed "s/SECRET_TELEGRAM_CHATID/$TG_CHAT/g")
          
          EXISTING_NOTIFS=$(curl -s -b /tmp/cookies.txt "${API_URL}/notification")
          if echo "$EXISTING_NOTIFS" | jq -e ".[]? | select(.name == \"{{ .name }}\")" > /dev/null; then
            echo "Notification client '{{ .name }}' già esistente. Salto."
          else
            echo "Creazione notification client '{{ .name }}'..."
            curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${NOTIF_PAYLOAD}" "${API_URL}/notification"
          fi
          {{- end }}

          # 7. CONFIGURAZIONE INDEXER
          {{- if .Values.autobrr.provisioning.indexers }}
          echo "Configurazione indexer..."
          {{- range .Values.autobrr.provisioning.indexers }}
          INDEXER_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          INDEXER_PAYLOAD=$(echo "$INDEXER_PAYLOAD" | sed "s/SECRET_PROWLARR_APIKEY/${PROWLARR_KEY}/g")
          
          # Imposta la lingua di default se non specificata
          INDEXER_PAYLOAD=$(echo "$INDEXER_PAYLOAD" | jq --arg lang "{{ default "it-it" $.Values.autobrr.provisioning.defaultLanguage }}" '. + {language: (.language // $lang)}')
          
          EXISTING_INDEXERS=$(curl -s -b /tmp/cookies.txt "${API_URL}/indexer")
          if echo "$EXISTING_INDEXERS" | jq -e ".[]? | select(.name == \"{{ .name }}\")" > /dev/null; then
            echo "Indexer '{{ .name }}' già esistente. Salto."
          else
            echo "Creazione indexer '{{ .name }}'..."
            curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${INDEXER_PAYLOAD}" "${API_URL}/indexer"
          fi
          {{- end }}
          {{- end }}

          # 8. IMPORTAZIONE FILTRI
          # Salviamo l'elenco degli indexer configurati per mapparne i nomi in ID numerici
          curl -s -b /tmp/cookies.txt "${API_URL}/indexer" > /tmp/indexers.json

          {{- range .Values.autobrr.provisioning.filters }}
          FILTER_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          
          # Risoluzione dinamica dei nomi degli indexer in ID numerici tramite jq (Formato Oggetto)
          FILTER_PAYLOAD=$(echo "$FILTER_PAYLOAD" | jq --slurpfile idxs /tmp/indexers.json '
            if .indexers != null and (.indexers | length > 0) then
              .indexers = ([.indexers[] as $name | ($idxs[0][] | select(.name == $name) | {id: .id}) | select(.id != null)])
            else
              .
            end
          ')

          # Controlla se il filtro esiste già
          EXISTING_FILTERS=$(curl -s -f -b /tmp/cookies.txt "${API_URL}/filters")
          FILTER_ID=$(echo "$EXISTING_FILTERS" | jq -r ".[]? | select(.name == \"{{ .name }}\") | .id" | head -n 1)

          if [ -n "$FILTER_ID" ] && [ "$FILTER_ID" != "null" ]; then
            echo "Filtro '{{ .name }}' (ID: $FILTER_ID) già esistente. Esecuzione sincronizzazione relazionale via PUT..."
            FILTER_PAYLOAD_WITH_ID=$(echo "$FILTER_PAYLOAD" | jq --argjson id "$FILTER_ID" '.id = $id')
            curl -s -f -b /tmp/cookies.txt -X PUT -H "Content-Type: application/json" -d "${FILTER_PAYLOAD_WITH_ID}" "${API_URL}/filters/$FILTER_ID"
          else
            echo "Creazione filtro '{{ .name }}' via POST..."
            # 1. Crea il filtro (POST)
            RESPONSE=$(curl -s -f -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${FILTER_PAYLOAD}" "${API_URL}/filters")
            NEW_FILTER_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            
            if [ -n "$NEW_FILTER_ID" ] && [ "$NEW_FILTER_ID" != "null" ]; then
              echo "Filtro '{{ .name }}' creato con successo (ID: $NEW_FILTER_ID). Esecuzione associazione indexer via PUT..."
              # Iniettiamo l'id nel payload per la PUT
              FILTER_PAYLOAD_WITH_ID=$(echo "$FILTER_PAYLOAD" | jq --argjson id "$NEW_FILTER_ID" '.id = $id')
              # 2. Associa gli indexer (PUT)
              curl -s -f -b /tmp/cookies.txt -X PUT -H "Content-Type: application/json" -d "${FILTER_PAYLOAD_WITH_ID}" "${API_URL}/filters/$NEW_FILTER_ID"
            else
              echo "Errore critico nella creazione del filtro '{{ .name }}'."
              exit 1
            fi
          fi
          {{- end }}


          echo "Provisioning completato con successo!"
      volumes:
      - name: autobrr-config
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-autobrr
      - name: admin-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.admin }}
          {{- if eq .Values.autobrr.provisioning.secrets.admin "servarr-api-keys" }}
          items:
          - key: autobrr-admin-user
            path: username
          - key: autobrr-admin-password
            path: password
          {{- end }}
      - name: qbit-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.qbittorrent }}
          {{- if eq .Values.autobrr.provisioning.secrets.qbittorrent "servarr-api-keys" }}
          items:
          - key: qbittorrent-user
            path: qbittorrent-user
          - key: qbittorrent-pass
            path: qbittorrent-pass
          {{- end }}
      - name: telegram-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.telegram }}
          {{- if eq .Values.autobrr.provisioning.secrets.telegram "servarr-api-keys" }}
          items:
          - key: telegram-token
            path: token
          {{- end }}
{{- end }}
