{{- if and .Values.autobrr.enabled .Values.autobrr.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-autobrr-provisioning
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: autobrr
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: provisioner
        image: {{ .Values.autobrr.image.repository }}:{{ .Values.autobrr.image.tag }}
        {{- if .Values.autobrr.env }}
        env:
        {{- range $key, $value := .Values.autobrr.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: autobrr-config
          mountPath: /config
        - name: admin-secrets-volume
          mountPath: /var/run/secrets/autobrr-admin
          readOnly: true
        - name: qbit-secrets-volume
          mountPath: /var/run/secrets/qbittorrent-creds
          readOnly: true
        - name: telegram-secrets-volume
          mountPath: /var/run/secrets/telegram-creds
          readOnly: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          API_URL="http://{{ .Release.Name }}-autobrr:{{ .Values.autobrr.service.port }}/api"

          # 1. ESTREZIONE CREDENZIALI
          ADMIN_USER=$(cat /var/run/secrets/autobrr-admin/username)
          ADMIN_PASS=$(cat /var/run/secrets/autobrr-admin/password)

          # 2. CREAZIONE UTENTE (Database Layer via CLI)
          echo "Inizializzazione utente amministratore nel database..."
          echo "$ADMIN_PASS" | autobrrctl --config /config create-user "$ADMIN_USER" || echo "Utente già esistente."

          # 3. ATTESA LIVENESS
          until curl -s -f "${API_URL}/healthz/readiness" > /dev/null; do
            echo "In attesa che il server web di Autobrr sia Ready..."
            sleep 3
          done

          # 4. LOGIN APPLICATIVO
          echo "Esecuzione login per recuperare il cookie di sessione..."
          curl -s -f -c /tmp/cookies.txt \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" \
            "${API_URL}/auth/login" > /dev/null

          # 5. CONFIGURAZIONE QBITTORRENT (Clients)
          Q_USER=$(cat /var/run/secrets/qbittorrent-creds/qbittorrent-user)
          Q_PASS=$(cat /var/run/secrets/qbittorrent-creds/qbittorrent-pass)
          
          {{- range .Values.autobrr.provisioning.clients }}
          CLIENT_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          CLIENT_PAYLOAD=$(echo "$CLIENT_PAYLOAD" | sed "s/SECRET_QBITTORRENT_USERNAME/$Q_USER/g" | sed "s/SECRET_QBITTORRENT_PASSWORD/$Q_PASS/g")
          curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${CLIENT_PAYLOAD}" "${API_URL}/download_clients"
          {{- end }}

          # 6. CONFIGURAZIONE TELEGRAM (Notifications)
          TG_TOKEN=$(cat /var/run/secrets/telegram-creds/token)
          TG_CHAT="{{ .Values.autobrr.provisioning.telegram.chatId }}"
          
          {{- range .Values.autobrr.provisioning.notifications }}
          NOTIF_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          NOTIF_PAYLOAD=$(echo "$NOTIF_PAYLOAD" | sed "s/SECRET_TELEGRAM_TOKEN/$TG_TOKEN/g" | sed "s/SECRET_TELEGRAM_CHATID/$TG_CHAT/g")
          curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${NOTIF_PAYLOAD}" "${API_URL}/notification_clients"
          {{- end }}
          
          # 7. IMPORTAZIONE FILTRI
          {{- range .Values.autobrr.provisioning.filters }}
          FILTER_PAYLOAD=$(cat <<'EOF'
          {{ toJson . }}
          EOF
          )
          curl -s -b /tmp/cookies.txt -H "Content-Type: application/json" -d "${FILTER_PAYLOAD}" "${API_URL}/filters"
          {{- end }}

          echo "Provisioning completato con successo!"
      volumes:
      - name: autobrr-config
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-autobrr-config
      - name: admin-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.admin }}
      - name: qbit-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.qbittorrent }}
      - name: telegram-secrets-volume
        secret:
          secretName: {{ .Values.autobrr.provisioning.secrets.telegram }}
{{- end }}
