{{- if .Values.radarr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-radarr
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  type: {{ .Values.radarr.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.radarr.service.port | default 7878 }}
      targetPort: http
      protocol: TCP
      name: http
{{ if (and (eq .Values.radarr.service.type "NodePort") (not (empty .Values.radarr.service.nodePort))) }}
      nodePort: {{.Values.radarr.service.nodePort}}
{{ end }}
{{- if and .Values.radarr.monitoring .Values.radarr.monitoring.enabled }}
    - port: {{ .Values.radarr.monitoring.port | default 9811 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
{{- end }}
  selector:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
