{{- if .Values.minimserver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" .Release.Name "minimserver" }}
  labels:
    app.kubernetes.io/name: minimserver
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.minimserver.service.type }}
  ports:
    - port: {{ .Values.minimserver.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.minimserver.service.statusPort }}
      targetPort: status
      protocol: TCP
      name: status
  selector:
    app.kubernetes.io/name: minimserver
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
{{- end }}
