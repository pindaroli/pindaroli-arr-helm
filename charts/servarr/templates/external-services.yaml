{{- $legacyIp := .Values.externalTrueNasIp }}

{{- if and (hasKey .Values "qbittorrent") (not .Values.qbittorrent.enabled) }}
{{- $qbtIp := dig "external" "ip" "" .Values.qbittorrent | default $legacyIp }}
{{- if $qbtIp }}
{{- $qbtPort := dig "external" "port" 8080 .Values.qbittorrent }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-qbittorrent-web
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  ports:
    - port: {{ $qbtPort }}
      targetPort: {{ $qbtPort }}
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Release.Name }}-qbittorrent-web
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
subsets:
  - addresses:
      - ip: {{ $qbtIp | quote }}
    ports:
      - port: {{ $qbtPort }}
        name: http
{{- end }}
{{- end }}
---
{{- if and (hasKey .Values "prowlarr") (not .Values.prowlarr.enabled) }}
{{- $prowlarrIp := dig "external" "ip" "" .Values.prowlarr | default $legacyIp }}
{{- if $prowlarrIp }}
{{- $prowlarrPort := dig "external" "port" 9696 .Values.prowlarr }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  ports:
    - port: {{ $prowlarrPort }}
      targetPort: {{ $prowlarrPort }}
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Release.Name }}-prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
subsets:
  - addresses:
      - ip: {{ $prowlarrIp | quote }}
    ports:
      - port: {{ $prowlarrPort }}
        name: http
{{- end }}
{{- end }}
---
{{- if and (hasKey .Values "flaresolverr") (not .Values.flaresolverr.enabled) }}
{{- $flaresolverrIp := dig "external" "ip" "" .Values.flaresolverr | default $legacyIp }}
{{- if $flaresolverrIp }}
{{- $flaresolverrPort := dig "external" "port" 8191 .Values.flaresolverr }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-flaresolverr
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  ports:
    - port: {{ $flaresolverrPort }}
      targetPort: {{ $flaresolverrPort }}
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .Release.Name }}-flaresolverr
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
subsets:
  - addresses:
      - ip: {{ $flaresolverrIp | quote }}
    ports:
      - port: {{ $flaresolverrPort }}
        name: http
{{- end }}
{{- end }}

