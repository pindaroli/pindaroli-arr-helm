name: traefik-cloudflared-source-ip
maintainers:
  - name: pindarolidev
    url: https://pindaroli.org
apiVersion: v2
appVersion: 2.10.7
version: 1.0.11
description: Pindaroli Traefik Cloudflared (Argo Tunnel) Real IP Helm Chart
home: https://github.com/pindarolidev/helm/tree/main/charts/traefik-cloudflared-source-ip
icon: https://pindaroli.org/images/pindaroli.svg
keywords:
  - kubernetes
  - cloudflare
  - cloudflared
  - middleware
  - real-ip
  - source-ip
  - argo-tunnel
  - argo
  - traefik
sources:
  - https://github.com/pindarolidev/traefik-cloudflared-source-ip

dependencies:
  - condition: global.cloudflaredEnabled
    name: cloudflared
    repository: https://charts.pindaroli.org
    # https://github.com/Masterminds/semver#checking-version-constraints
    version: 1.x.x
  - condition: global.traefikEnabled
    name: traefik
    repository: https://traefik.github.io/charts
    version: 26.0.0
