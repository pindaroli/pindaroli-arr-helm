name: Build & Publish Custom qBittorrent Image

on:
  push:
    branches:
      - main
    paths:
      - 'custom-docker-images/custom-qbittorrent/**'
      - '.github/workflows/build-custom-qbittorrent.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave empty to use VERSION file)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push custom-qbittorrent to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version Tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ -f "./custom-docker-images/custom-qbittorrent/VERSION" ]; then
            TAG=$(cat ./custom-docker-images/custom-qbittorrent/VERSION | tr -d '\r\n ')
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag set to: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/custom-qbittorrent
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./custom-docker-images/custom-qbittorrent
          file: ./custom-docker-images/custom-qbittorrent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
