name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  release:
    name: Release Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Pre-populate Helm Dependency Cache
        # Registriamo i repository esterni (come Traefik e Bitnami) prima di fare dependency update
        # per aggirare il bug di cache di Helm (Issue #13632) in presenza di dipendenze locali file://
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Update Dependencies and Package Charts
        run: |
          mkdir .cr-release-packages
          
          # 1. Aggiorna le dipendenze per ciascuna chart.
          # Le dipendenze contrassegnate con file:// saranno risolte localmente offline.
          # Le dipendenze esterne (traefik, bitnami) verranno scaricate usando la cache pre-popolata.
          for dir in charts/*; do
            if [ -d "$dir" ]; then
              echo "==> Aggiornamento dipendenze per $(basename "$dir")..."
              helm dependency update "$dir"
            fi
          done
          
          # 2. Genera il pacchetto .tgz per tutte le chart
          for dir in charts/*; do
            if [ -d "$dir" ]; then
              echo "==> Pacchettizzazione di $(basename "$dir")..."
              helm package "$dir" -d .cr-release-packages
            fi
          done

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_packaging: true
          charts_dir: charts
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
