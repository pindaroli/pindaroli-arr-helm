name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  release:
    name: Release Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Prepare Self-Aware Packaging
        run: |
          mkdir .cr-release-packages
          # 1. Package cloudflared first (it's a dependency for others)
          helm package charts/cloudflared -d .cr-release-packages
          
          # 2. Create a local index and register it so other charts can find cloudflared
          helm repo index .cr-release-packages --url https://pindaroli.github.io/pindaroli-arr-helm/
          helm repo add pindaroli file://$(pwd)/.cr-release-packages
          
          # 3. Package all other charts with dependency update
          for dir in charts/*; do
            if [ -d "$dir" ] && [ "$(basename "$dir")" != "cloudflared" ]; then
              helm dependency update "$dir"
              helm package "$dir" -d .cr-release-packages
            fi
          done

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_packaging: true
          charts_dir: .deploy
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
